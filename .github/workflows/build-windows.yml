name: Build AN AI Relight V5

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build V5 engine
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy opencv-python-headless pillow onnxruntime replicate requests
          New-Item -ItemType Directory -Force -Path build_assets | Out-Null

          Invoke-WebRequest -Uri 'https://github.com/yakhyo/modnet/releases/download/weights/modnet_photographic.onnx' -OutFile 'build_assets/modnet_photographic.onnx'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/yakhyo/modnet/main/LICENSE' -OutFile 'build_assets/MODNET-LICENSE.txt'

          Invoke-WebRequest -Uri 'https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx' -OutFile 'build_assets/face_detection_yunet_2023mar.onnx'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/opencv/opencv/master/LICENSE' -OutFile 'build_assets/OPENCV-LICENSE.txt'

          pyinstaller --noconfirm --clean --onefile --name relight_engine `
            --collect-all onnxruntime `
            --collect-all replicate `
            --add-data 'build_assets/modnet_photographic.onnx;models' `
            --add-data 'build_assets/face_detection_yunet_2023mar.onnx;models' `
            payload/relight_engine.py

          Copy-Item 'dist/relight_engine.exe' 'build_assets/relight_engine.exe' -Force
          & 'build_assets/relight_engine.exe' --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'V5 engine smoke test failed.' }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build V5 Windows installer
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          dotnet publish installer/Installer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist
          $exe = Join-Path $PWD 'dist/AN-AI-Relight-V5-Setup.exe'
          if (-not (Test-Path $exe)) { throw 'V5 installer EXE was not generated.' }
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
          Get-Item $exe | Format-List Name,Length,FullName

      - name: Upload V5 installer
        uses: actions/upload-artifact@v4
        with:
          name: AN-AI-Relight-V5-Windows
          path: |
            dist/AN-AI-Relight-V5-Setup.exe
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
